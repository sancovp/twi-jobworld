name: Build & publish avi-jw image

# The paid update channel: every push to a deploy branch builds Dockerfile.sdk
# and publishes ghcr.io/<owner>/avi-jw:{latest,<sha>}. Buyer boxes pull this
# (watchtower auto-updates). Requires the base image jobworld-cave to be on GHCR
# already (deploy/push-base.sh, once).
on:
  push:
    branches: [main, worker-layer]
    paths:
      - "Dockerfile.sdk"
      - "connectors/**"
      - "clients/**"
      - "agents/**"
      - "skills/**"
      - "server/**"
      - "deploy/entrypoint-sdk.sh"
      - "p_main_agent.py"
      - "convo_registry.py"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/avi-jw
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/jobworld-cave:latest

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # GITHUB_TOKEN can push to GHCR — no personal scope needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sdk
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
