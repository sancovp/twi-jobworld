[project]
name = "jw-outreach"
version = "0.1.0"
description = "Universal JW outreach CLI — only the external-effect functions. Copy/rules/templates are instructions for the LLM, not code."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
jwout = "jw_outreach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
